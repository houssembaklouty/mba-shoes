version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: mba-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mba_wp}
      MYSQL_USER: ${MYSQL_USER:-mba_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mba_pass}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  wordpress:
    build: ./docker/wordpress
    container_name: mba-wordpress
    restart: unless-stopped
    ports:
      - "${WP_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: mysql
      WORDPRESS_DB_USER: ${MYSQL_USER:-mba_user}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-mba_pass}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-mba_wp}
      WORDPRESS_TABLE_PREFIX: ${WP_TABLE_PREFIX:-wp_}
      WORDPRESS_DEBUG: ${WP_DEBUG:-0}
      # WP_PUBLIC_URL (fichier .env) : adresse publique du site, ex. un tunnel
      # ngrok en HTTPS pour tester l'app WooCommerce. Vide = http://localhost.
      # Derriere un proxy HTTPS (ngrok), X-Forwarded-Proto signale le HTTPS.
      WORDPRESS_CONFIG_EXTRA: |
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') { $$_SERVER['HTTPS'] = 'on'; }
        define('WP_HOME', '${WP_PUBLIC_URL:-http://localhost:${WP_PORT:-8080}}');
        define('WP_SITEURL', '${WP_PUBLIC_URL:-http://localhost:${WP_PORT:-8080}}');
      # SMTP de dev (Mailtrap), lu par wp-content/mu-plugins/smtp-from-env.php.
      # Vide = WordPress garde son envoi par defaut.
      MAIL_MAILER: ${MAIL_MAILER:-}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
    volumes:
      - ./wp-content:/var/www/html/wp-content
      - ./api:/var/www/html/api
    depends_on:
      mysql:
        condition: service_healthy

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: mba-phpmyadmin
    restart: unless-stopped
    ports:
      - "${PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
    depends_on:
      - mysql

volumes:
  mysql_data:
