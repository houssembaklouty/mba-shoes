upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 300
date.timezone = Africa/Tunis
memory_limit = 256M

; OPcache production : le PHP compile une fois, sert depuis la memoire.
; revalidate_freq=60 : les fichiers modifies (theme monte) sont reperes
; au pire une minute plus tard — bon compromis prod/souplesse.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 16000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60
