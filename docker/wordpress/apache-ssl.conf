# Vhosts de production pour 100cuir.com (certificat Let's Encrypt monte
# depuis /etc/letsencrypt du VPS — voir docker-compose.prod.yml).
# Le port 80 redirige vers HTTPS ; l'ACME n'en depend pas (renouvellement
# en standalone avec arret/redemarrage du conteneur — renewal-hooks).
<VirtualHost *:80>
    ServerName 100cuir.com
    Redirect permanent / https://100cuir.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName 100cuir.com
    ServerAlias www.100cuir.com
    DocumentRoot /var/www/html

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/100cuir.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/100cuir.com/privkey.pem

    <Directory /var/www/html>
        AllowOverride All
    </Directory>
</VirtualHost>
