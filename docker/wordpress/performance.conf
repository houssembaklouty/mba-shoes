# Performance Apache (production) — charge globalement via conf-enabled.
# HTTP/2 : chargement parallele des ressources (HTTP/1.1 fait la queue).
# h2c : HTTP/2 en clair pour les proxys internes eventuels.
Protocols h2 h2c http/1.1

# Compression des textes (CSS ~divises par 3-4, JS et JSON aussi).
<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/plain text/css text/xml
    AddOutputFilterByType DEFLATE application/javascript application/json
    AddOutputFilterByType DEFLATE image/svg+xml
    AddOutputFilterByType DEFLATE font/ttf font/otf application/vnd.ms-fontobject
</IfModule>

# Cache navigateur des fichiers statiques (les themes versionnent par ?ver=).
<IfModule mod_expires.c>
    ExpiresActive On
    ExpiresByType text/css "access plus 1 month"
    ExpiresByType application/javascript "access plus 1 month"
    ExpiresByType image/jpeg "access plus 1 month"
    ExpiresByType image/png "access plus 1 month"
    ExpiresByType image/webp "access plus 1 month"
    ExpiresByType image/svg+xml "access plus 1 month"
    ExpiresByType font/woff2 "access plus 1 year"
    ExpiresByType font/ttf "access plus 1 year"
</IfModule>
