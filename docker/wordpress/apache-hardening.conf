# Durcissement Apache (production) — pose apres l'incident du 13/10/2026.
# Bloque au niveau serveur ce que le mu-plugin bloque au niveau PHP :
# double defense, et zero charge PHP pour les requetes malveillantes.

# XML-RPC : personne ne l'utilise sur cette boutique → 403 sec.
<FilesMatch "^(xmlrpc\.php)$">
    Require all denied
</FilesMatch>

# Fichiers d'information/version : rien a montrer.
<FilesMatch "^(readme\.html|license\.txt|wp-config-sample\.php|wp-admin/install\.php)$">
    <IfModule mod_rewrite.c>
        RewriteEngine On
    </IfModule>
    Require all denied
</FilesMatch>

# Journaux et fichiers internes jamais servis.
<FilesMatch "\.(log|ini|sh|bak|sql)$">
    Require all denied
</FilesMatch>

# Pas de listage des repertoires (meme si index.php manque quelque part).
<IfModule mod_autoindex.c>
    Options -Indexes
</IfModule>

# En-tetes de securite generales.
<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
</IfModule>
